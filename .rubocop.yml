inherit_from: .rubocop_todo.yml

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.0
  Include:
    - '**/*.rb'
    - '**/*.gemspec'
    - '**/Gemfile'
    - Appraisals
    - Dangerfile
    - bin/console
    - Guardfile
    - Rakefile
  Exclude:
    - .bundle/**/*
    - vendor/**/*
    - 'gemfiles/*.gemfile'

plugins:
  - rubocop-exception_messages
  - rubocop-rake
  - rubocop-rspec

ExceptionMessages/Casing:
  Enabled: true
  EnforcedStyle: lowercase

ExceptionMessages/Punctuation:
  Enabled: true
  EnforcedStyle: no_period

ExceptionMessages/QuoteStyle:
  Enabled: true

ExceptionMessages/RedundantExceptionName:
  Enabled: true

Layout/LineLength:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

Metrics/AbcSize:
  Enabled: false

Metrics/PerceivedComplexity:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

Metrics/CyclomaticComplexity:
  Enabled: false

Metrics/ModuleLength:
  Enabled: false

Metrics/BlockLength:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: always_true
