inherit_from: .rubocop_todo.yml

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.0
  Include:
    - '**/*.rb'
    - '**/*.md'
    - '**/*.markdown'
    - '**/*.txt'
    - '**/*.gemspec'
    - '**/Gemfile'
    - Dangerfile
    - bin/console
    - Guardfile
    - Rakefile
  Exclude:
    - .bundle/**/*
    - vendor/**/*

plugins:
  - rubocop-exception_messages
  - rubocop-rake
  - rubocop-rspec
  - rubocop-spellcheck

ExceptionMessages/Casing:
  Enabled: true
  EnforcedStyle: lowercase

ExceptionMessages/Punctuation:
  Enabled: true
  EnforcedStyle: no_period

ExceptionMessages/QuoteStyle:
  Enabled: true

ExceptionMessages/RedundantExceptionName:
  Enabled: true

Layout/LineLength:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

Metrics/AbcSize:
  Enabled: false

Metrics/PerceivedComplexity:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

Metrics/CyclomaticComplexity:
  Enabled: false

Metrics/ModuleLength:
  Enabled: false

Metrics/BlockLength:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: always_true

Spellcheck:
  DictionaryFiles:
    en:
      - gem:rubocop-spellcheck/data/en/en.dic
      - .spellcheck.txt
